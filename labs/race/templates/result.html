{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}

<div class="result-card {{ 'success' if success else 'failure' }}">
    <h2>{{ title }}</h2>
    <p class="result-message">{{ message }}</p>

    {% if flag %}
    <div class="flag-box">
        <span class="flag-label">FLAG CAPTURED</span>
        <code class="flag-value">{{ flag }}</code>
    </div>
    {% endif %}
</div>

<div class="nav-links">
    <a href="/" class="btn">Back to Dashboard</a>
    <a href="/reset" class="btn btn-danger">Reset All Data</a>
</div>

{% endblock %}
