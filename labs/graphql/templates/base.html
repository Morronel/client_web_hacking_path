<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NeonGraph{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <div class="brand">// NeonGraph</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/graphql">GraphQL IDE</a>
            <a href="/reset">Reset DB</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        NeonGraph v1.0 &mdash; Social Network GraphQL API &mdash; Port 5015
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
